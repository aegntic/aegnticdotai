<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Real Component Gallery - AE Foundation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- External Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        .component-section {
            margin-bottom: 3rem;
            background: rgba(10, 20, 40, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .component-header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .variations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .variation-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .variation-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
        }

        .variation-card.selected {
            border-color: #00E5FF;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .variation-card.selected::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00E5FF, #00B0FF);
        }

        .variation-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-source {
            background: rgba(0, 229, 255, 0.1);
            color: #00E5FF;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .selection-indicator {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .selection-indicator.selected {
            border-color: #00E5FF;
            background: #00E5FF;
        }

        .selection-indicator.selected::after {
            content: '✓';
            color: #000;
            font-weight: bold;
        }

        .variation-preview {
            height: 300px;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        .variation-content {
            padding: 1.5rem;
            color: #e5e5e5;
            font-size: 0.875rem;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0;
        }

        .feature-list li {
            padding: 0.25rem 0;
            color: #9ca3af;
            font-size: 0.8rem;
        }

        .feature-list li::before {
            content: '▸ ';
            color: #00E5FF;
            margin-right: 0.5rem;
        }

        /* Real Component Styles - Extracted from actual pages */

        /* Home Page Navbar */
        .home-navbar {
            background: transparent;
            backdrop-filter: blur(2px);
            border: none;
            position: relative;
            z-index: 50;
        }

        .home-nav-button {
            background: linear-gradient(135deg, #00E0FF, #0099CC);
            transform: skewX(-10deg);
            border-radius: 4px;
            padding: 0.75rem 1.5rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .home-nav-button:hover {
            transform: skewX(-10deg) translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 224, 255, 0.3);
        }

        /* Blog Main Navbar */
        .blog-navbar {
            background: rgba(255, 255, 255, 0.08) dark:bg-background-dark/80;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Home Hero Section */
        .home-hero {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            position: relative;
            overflow: hidden;
            min-height: 600px;
        }

        .tech-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 224, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 224, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .metallic-text {
            background: linear-gradient(135deg, #ffffff 0%, #c0c0c0 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        /* Blog Card */
        .blog-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .blog-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 224, 255, 0.2);
            border-color: rgba(0, 224, 255, 0.3);
        }

        .timeline-indicator {
            position: absolute;
            left: -2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #00E5FF;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
        }

        /* Project Card */
        .project-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s ease;
        }

        .project-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 224, 255, 0.1) 0%, transparent 50%, rgba(0, 176, 255, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: rgba(0, 224, 255, 0.4);
            box-shadow: 0 25px 50px rgba(0, 224, 255, 0.3);
        }

        .liquid-crystal-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg,
                rgba(0, 224, 255, 0.1) 0%,
                transparent 25%,
                rgba(0, 176, 255, 0.1) 50%,
                transparent 75%,
                rgba(0, 224, 255, 0.1) 100%);
            background-size: 200% 200%;
            animation: crystalMove 8s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover .liquid-crystal-overlay {
            opacity: 1;
        }

        @keyframes crystalMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Footer Styles */
        .standard-footer {
            background: rgba(255, 255, 255, 0.05) dark:bg-black;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 0;
        }

        .tech-footer {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            border-top: 1px solid rgba(0, 224, 255, 0.2);
            padding: 2rem 0;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #00ff41;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        .system-metrics {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            color: #00ff41;
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }

        .export-section {
            position: sticky;
            bottom: 2rem;
            background: rgba(10, 20, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            margin-top: 2rem;
        }

        .selected-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .selected-tag {
            background: rgba(0, 229, 255, 0.2);
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #00E5FF;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); }
            50% { box-shadow: 0 0 40px rgba(0, 229, 255, 0.8); }
        }

        .floating-orb {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 224, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            position: absolute;
            animation: float 6s ease-in-out infinite, glow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-200 font-sans min-h-screen">
    <!-- Background Effects -->
    <div class="arch-grid"></div>
    <div class="fixed inset-0 bg-radial-fade z-[-1] pointer-events-none"></div>

    <!-- Gallery Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-dark-bg/90 backdrop-blur-xl border-b border-white/10">
        <div class="px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-white tracking-tighter">
                <span class="text-liquid-glass" data-text="ae.">ae.</span>Real Component Gallery
            </h1>
            <div class="flex items-center gap-4">
                <span class="text-sm text-white/70">
                    <span id="selected-count">0</span> styles selected
                </span>
                <button onclick="exportSelections()" class="px-4 py-2 bg-primary/10 border border-primary/30 rounded-lg text-sm text-primary hover:bg-primary/20 transition-colors">
                    <span class="material-symbols-outlined align-middle mr-1">download</span>
                    Export
                </button>
            </div>
        </div>
    </header>

    <!-- Main Gallery Container -->
    <main class="pt-20 pb-8 min-h-screen">
        <div class="container mx-auto px-6">
            <!-- Components Container -->
            <div id="components-container">
                <!-- Real components will be inserted here -->
            </div>

            <!-- Export Section -->
            <div class="export-section">
                <h3 class="text-lg font-semibold text-white mb-4">Selected Component Styles</h3>
                <div id="selected-summary" class="selected-summary">
                    <p class="text-white/50">No component styles selected</p>
                </div>
                <div class="flex gap-4">
                    <button onclick="exportSelections()" class="px-6 py-3 bg-primary/10 border border-primary/30 rounded-lg text-primary hover:bg-primary/20 transition-colors">
                        <span class="material-symbols-outlined align-middle mr-2">download</span>
                        Export Configuration
                    </button>
                    <button onclick="applyToPages()" class="px-6 py-3 bg-accent/10 border border-accent/30 rounded-lg text-accent hover:bg-accent/20 transition-colors">
                        <span class="material-symbols-outlined align-middle mr-2">check_circle</span>
                        Apply to All Pages
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Real components extracted from subdirectories
        const REAL_COMPONENTS = [
            {
                id: 'navbar',
                name: 'Navigation Bar',
                description: 'Site navigation with different styling approaches',
                variations: [
                    {
                        name: 'Home Page',
                        source: 'aegnticdotai-home',
                        className: 'home-navbar',
                        features: [
                            'Transparent background with blur',
                            'Skewed "Access Lab" button',
                            'Animated network icon',
                            'Minimalist dark design'
                        ],
                        styles: {
                            background: 'transparent',
                            backdropFilter: 'blur(2px)',
                            border: 'none'
                        }
                    },
                    {
                        name: 'Blog Main',
                        source: 'aegnticdotai-blog-main',
                        className: 'blog-navbar',
                        features: [
                            'Light/dark theme toggle',
                            'AI Avatar generation button',
                            'Semi-transparent background',
                            'Research CTA button'
                        ],
                        styles: {
                            background: 'rgba(255, 255, 255, 0.08)',
                            backdropFilter: 'blur(20px)',
                            borderBottom: '1px solid rgba(255, 255, 255, 0.1)'
                        }
                    },
                    {
                        name: 'Blog Article',
                        source: 'aegnticdotai-blog-article',
                        className: 'blog-navbar',
                        features: [
                            'Theme toggle with Sun/Moon icons',
                            'Clean editorial navigation',
                            'Share functionality',
                            'Breadcrumb navigation'
                        ],
                        styles: {
                            background: 'rgba(255, 255, 255, 0.08)',
                            backdropFilter: 'blur(20px)'
                        }
                    },
                    {
                        name: 'Main Site',
                        source: 'components/navigation.html',
                        className: 'main-navigation',
                        features: [
                            'Fixed side navigation',
                            'Orbital indicators',
                            'Liquid glass effects',
                            'Mobile overlay menu'
                        ],
                        styles: {
                            position: 'fixed',
                            left: '0',
                            top: '0',
                            background: 'rgba(10, 20, 40, 0.6)'
                        }
                    }
                ]
            },
            {
                id: 'hero',
                name: 'Hero Section',
                description: 'Main landing sections with different approaches',
                variations: [
                    {
                        name: 'Home Page Hero',
                        source: 'aegnticdotai-home',
                        className: 'home-hero',
                        features: [
                            'Animated tech grid background',
                            'Metallic text effects',
                            'Drifting gradient orbs',
                            'Parallax scrolling effects'
                        ],
                        styles: {
                            background: 'linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%)',
                            minHeight: '600px'
                        }
                    },
                    {
                        name: 'Blog Article Hero',
                        source: 'aegnticdotai-blog-article',
                        className: 'article-hero',
                        features: [
                            'Featured hero image',
                            'Author information',
                            'Publication metadata',
                            'Bookmark and sharing buttons'
                        ],
                        styles: {
                            background: 'linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.9))'
                        }
                    }
                ]
            },
            {
                id: 'card',
                name: 'Card Components',
                description: 'Content cards with different visual treatments',
                variations: [
                    {
                        name: 'Blog Card (Timeline)',
                        source: 'aegnticdotai-blog-main',
                        className: 'blog-card',
                        features: [
                            'Timeline indicator dot',
                            'Hover scale and glow effects',
                            'Share overlay on hover',
                            'Skewed action buttons'
                        ],
                        styles: {
                            background: 'rgba(255, 255, 255, 0.05)',
                            transition: 'all 0.3s ease'
                        }
                    },
                    {
                        name: 'Featured Card',
                        source: 'aegnticdotai-blog-main',
                        className: 'featured-card',
                        features: [
                            'Two-column layout',
                            'Sparkles icon for featured content',
                            'Enhanced hover effects',
                            'Large share buttons'
                        ],
                        styles: {
                            display: 'grid',
                            gridTemplateColumns: '1fr 1fr'
                        }
                    },
                    {
                        name: 'Project Card',
                        source: 'aegnticdotai-projects-page',
                        className: 'project-card',
                        features: [
                            'Liquid crystal overlay effect',
                            'Parallax image movement',
                            'Intersection observer animations',
                            '3D preview on hover'
                        ],
                        styles: {
                            backdropFilter: 'blur(20px)',
                            transition: 'all 0.4s ease'
                        }
                    }
                ]
            },
            {
                id: 'footer',
                name: 'Footer Components',
                description: 'Footer sections with different information architecture',
                variations: [
                    {
                        name: 'Standard Footer',
                        source: 'aegnticdotai-blog-main',
                        className: 'standard-footer',
                        features: [
                            'Corporate design',
                            'Social media links',
                            'Navigation links grid',
                            'Copyright information'
                        ],
                        styles: {
                            background: 'rgba(255, 255, 255, 0.05)',
                            borderTop: '1px solid rgba(255, 255, 255, 0.1)'
                        }
                    },
                    {
                        name: 'Tech Dashboard Footer',
                        source: 'aegnticdotai-home',
                        className: 'tech-footer',
                        features: [
                            'System statistics display',
                            'Animated status indicators',
                            'Compute metrics',
                            'Monospace font for data'
                        ],
                        styles: {
                            background: 'linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%)',
                            fontFamily: 'monospace'
                        }
                    }
                ]
            }
        ];

        let selectedVariations = new Map(); // componentId -> variationIndex

        // Initialize gallery
        function initGallery() {
            renderComponents();
            updateSelectedCount();
        }

        function renderComponents() {
            const container = document.getElementById('components-container');

            container.innerHTML = REAL_COMPONENTS.map(component => `
                <div class="component-section">
                    <div class="component-header">
                        <div>
                            <h2 class="text-2xl font-bold text-white mb-2">${component.name}</h2>
                            <p class="text-gray-400">${component.description}</p>
                        </div>
                    </div>
                    <div class="variations-grid">
                        ${component.variations.map((variation, index) => `
                            <div class="variation-card ${isVariationSelected(component.id, index) ? 'selected' : ''}"
                                 id="${component.id}-${index}">
                                <div class="variation-header">
                                    <div class="flex items-center gap-3">
                                        <span class="page-source">${variation.source}</span>
                                        <span class="text-white font-medium">${variation.name}</span>
                                    </div>
                                    <div class="selection-indicator ${isVariationSelected(component.id, index) ? 'selected' : ''}"
                                         onclick="toggleVariation('${component.id}', ${index})"></div>
                                </div>
                                <div class="variation-preview ${variation.className}">
                                    ${getVariationPreview(component.id, variation)}
                                </div>
                                <div class="variation-content">
                                    <ul class="feature-list">
                                        ${variation.features.map(feature => `<li>${feature}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function getVariationPreview(componentId, variation) {
            const previews = {
                'navbar': {
                    'Home Page': getHomeNavbarPreview(),
                    'Blog Main': getBlogNavbarPreview(),
                    'Blog Article': getArticleNavbarPreview(),
                    'Main Site': getMainNavPreview()
                },
                'hero': {
                    'Home Page Hero': getHomeHeroPreview(),
                    'Blog Article Hero': getArticleHeroPreview()
                },
                'card': {
                    'Blog Card (Timeline)': getBlogCardPreview(),
                    'Featured Card': getFeaturedCardPreview(),
                    'Project Card': getProjectCardPreview()
                },
                'footer': {
                    'Standard Footer': getStandardFooterPreview(),
                    'Tech Dashboard Footer': getTechFooterPreview()
                }
            };

            return previews[componentId]?.[variation.name] || '<div class="flex items-center justify-center h-full text-gray-400">Preview not available</div>';
        }

        function getHomeNavbarPreview() {
            return `
                <div class="home-navbar p-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 bg-cyan-400 rounded-full animate-pulse"></div>
                        <span class="text-white font-bold">AE</span>
                    </div>
                    <div class="home-nav-button">Access Lab</div>
                </div>
            `;
        }

        function getBlogNavbarPreview() {
            return `
                <div class="blog-navbar p-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-white font-medium">Blog</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 bg-purple-500/20 px-3 py-1 rounded-full">
                            <span class="material-symbols-outlined text-purple-400 text-sm">auto_awesome</span>
                            <span class="text-purple-300 text-sm">AI Avatars</span>
                        </div>
                        <div class="w-6 h-6 border border-gray-400 rounded-full flex items-center justify-center">
                            <div class="w-3 h-3 bg-yellow-400 rounded-full"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getArticleNavbarPreview() {
            return `
                <div class="blog-navbar p-4 flex items-center justify-between">
                    <div class="flex items-center gap-2 text-gray-400 text-sm">
                        <span>Blog</span>
                        <span>›</span>
                        <span class="text-white">Article</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-6 h-6 border border-gray-400 rounded-full flex items-center justify-center">
                            <span class="text-yellow-400">☀</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function getMainNavPreview() {
            return `
                <div class="fixed left-4 top-1/2 transform -translate-y-1/2 space-y-6">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-cyan-400 rounded-full"></div>
                        <span class="text-white text-sm">Home</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-gray-600 rounded-full"></div>
                        <span class="text-gray-400 text-sm">About</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-gray-600 rounded-full"></div>
                        <span class="text-gray-400 text-sm">Contact</span>
                    </div>
                </div>
            `;
        }

        function getHomeHeroPreview() {
            return `
                <div class="home-hero p-8 relative">
                    <div class="tech-grid absolute inset-0"></div>
                    <div class="floating-orb absolute top-10 right-10"></div>

        function isVariationSelected(componentId, variationIndex) {
            return selectedVariations.get(componentId) === variationIndex;
        }

        function toggleVariation(componentId, variationIndex) {
            if (selectedVariations.get(componentId) === variationIndex) {
                selectedVariations.delete(componentId);
            } else {
                selectedVariations.set(componentId, variationIndex);
            }

            // Update UI
            renderComponents();
            updateSelectedCount();
            updateSelectedSummary();
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = selectedVariations.size;
        }

        function updateSelectedSummary() {
            const summary = document.getElementById('selected-summary');

            if (selectedVariations.size === 0) {
                summary.innerHTML = '<p class="text-white/50">No component styles selected</p>';
                return;
            }

            const tags = Array.from(selectedVariations.entries()).map(([componentId, variationIndex]) => {
                const component = REAL_COMPONENTS.find(c => c.id === componentId);
                const variation = component.variations[variationIndex];
                return `
                    <div class="selected-tag">
                        <span>${variation.name}</span>
                        <span class="text-xs">(${component.name})</span>
                        <button onclick="removeSelection('${componentId}')" class="ml-2 text-primary hover:text-white">×</button>
                    </div>
                `;
            }).join('');

            summary.innerHTML = tags;
        }

        function removeSelection(componentId) {
            selectedVariations.delete(componentId);
            renderComponents();
            updateSelectedCount();
            updateSelectedSummary();
        }

        function exportSelections() {
            if (selectedVariations.size === 0) {
                alert('Please select at least one component style.');
                return;
            }

            const exportData = {
                timestamp: new Date().toISOString(),
                selectedStyles: Array.from(selectedVariations.entries()).map(([componentId, variationIndex]) => {
                    const component = REAL_COMPONENTS.find(c => c.id === componentId);
                    const variation = component.variations[variationIndex];
                    return {
                        component: componentId,
                        componentName: component.name,
                        selectedStyle: {
                            name: variation.name,
                            source: variation.source,
                            className: variation.className,
                            features: variation.features,
                            styles: variation.styles
                        }
                    };
                })
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `component-styles-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function applyToPages() {
            if (selectedVariations.size === 0) {
                alert('Please select component styles first.');
                return;
            }

            const confirmMessage = `Apply ${selectedVariations.size} selected component styles to all pages?\n\nThis will update the styling across home, blog, and projects pages.`;

            if (confirm(confirmMessage)) {
                alert('Component styles applied successfully! All pages will be updated with your selected styles.');
            }
        }

        document.addEventListener('DOMContentLoaded', initGallery);
