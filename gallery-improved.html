<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Component Gallery - AE Foundation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- External Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        .component-section {
            margin-bottom: 3rem;
            background: rgba(10, 20, 40, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .component-header {
            margin-bottom: 2rem;
        }

        .variations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .variation-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .variation-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
        }

        .variation-card.selected {
            border-color: #00E5FF;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .variation-card.selected::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00E5FF, #00B0FF);
        }

        .variation-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: between;
            align-items: center;
        }

        .variation-name {
            font-weight: 600;
            color: #00E5FF;
        }

        .selection-indicator {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .selection-indicator.selected {
            border-color: #00E5FF;
            background: #00E5FF;
        }

        .selection-indicator.selected::after {
            content: '✓';
            color: #000;
            font-weight: bold;
        }

        .variation-preview {
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .variation-details {
            padding: 1rem 1.5rem;
        }

        .config-preview {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #4ade80;
            margin-top: 0.75rem;
            max-height: 100px;
            overflow-y: auto;
        }

        .filter-section {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .export-section {
            position: sticky;
            bottom: 2rem;
            background: rgba(10, 20, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            margin-top: 2rem;
        }

        .selected-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .selected-tag {
            background: rgba(0, 229, 255, 0.2);
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #00E5FF;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .component-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #00E5FF;
            margin-right: 0.5rem;
        }

        /* Component-specific preview styles */
        .quantum-grid-standard {
            background: radial-gradient(circle at center, #001525 0%, #000511 100%);
        }

        .quantum-grid-minimal {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }

        .quantum-grid-intense {
            background: radial-gradient(circle at center, #0a1929 0%, #001e3c 50%, #000511 100%);
        }

        .terminal-matrix {
            background: #0a0a0a;
            color: #00ff41;
        }

        .terminal-cyberpunk {
            background: #1a0033;
            color: #ff00ff;
        }

        .terminal-retro {
            background: #2d2d2d;
            color: #00ff00;
        }

        .audio-default {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .audio-minimal {
            background: #0f0f0f;
        }

        .audio-full {
            background: linear-gradient(45deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%);
        }

        .cursor-neon {
            background: #000;
            cursor: none;
        }

        .cursor-minimal {
            background: #0a0a0a;
            cursor: none;
        }

        .cursor-particles {
            background: #001525;
            cursor: none;
        }

        .preloader-spinner {
            background: #050510;
        }

        .preloader-progress {
            background: #0a0a0a;
        }

        .preloader-pulse {
            background: #001122;
        }

        .visualizer-floating {
            background: rgba(0, 0, 0, 0.9);
        }

        .visualizer-header {
            background: rgba(10, 20, 40, 0.9);
        }

        .visualizer-sidebar {
            background: rgba(15, 15, 30, 0.9);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .floating-demo {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .pulse-demo {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-demo {
            animation: spin 2s linear infinite;
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-200 font-sans min-h-screen">
    <!-- Background Effects -->
    <div class="arch-grid"></div>
    <div class="fixed inset-0 bg-radial-fade z-[-1] pointer-events-none"></div>

    <!-- Gallery Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-dark-bg/90 backdrop-blur-xl border-b border-white/10">
        <div class="px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-white tracking-tighter">
                <span class="text-liquid-glass" data-text="ae.">ae.</span>Component Variation Gallery
            </h1>
            <div class="flex items-center gap-4">
                <span class="text-sm text-white/70">
                    <span id="selected-count">0</span> selections
                </span>
                <button onclick="exportSelections()" class="px-4 py-2 bg-primary/10 border border-primary/30 rounded-lg text-sm text-primary hover:bg-primary/20 transition-colors">
                    <span class="material-symbols-outlined align-middle mr-1">download</span>
                    Export Selections
                </button>
            </div>
        </div>
    </header>

    <!-- Main Gallery Container -->
    <main class="pt-20 pb-8 min-h-screen">
        <div class="container mx-auto px-6">
            <!-- Filters -->
            <div class="filter-section">
                <h2 class="text-lg font-semibold text-white mb-4">Filter Components</h2>
                <div class="flex flex-wrap gap-2 mb-4">
                    <button class="filter-btn active" data-category="all">All Components</button>
                    <button class="filter-btn" data-category="background">Backgrounds</button>
                    <button class="filter-btn" data-category="ui">UI Elements</button>
                    <button class="filter-btn" data-category="interactive">Interactive</button>
                    <button class="filter-btn" data-category="utility">Utilities</button>
                </div>
                <div class="flex gap-4">
                    <button onclick="selectAll()" class="px-4 py-2 border border-white/20 rounded-lg text-sm text-white/70 hover:text-white hover:border-white/40 transition-colors">
                        Select All
                    </button>
                    <button onclick="clearSelections()" class="px-4 py-2 border border-white/20 rounded-lg text-sm text-white/70 hover:text-white hover:border-white/40 transition-colors">
                        Clear Selections
                    </button>
                </div>
            </div>

            <!-- Components Container -->
            <div id="components-container">
                <!-- Components will be inserted here -->
            </div>

            <!-- Export Section -->
            <div class="export-section">
                <h3 class="text-lg font-semibold text-white mb-4">Selected Components</h3>
                <div id="selected-summary" class="selected-summary">
                    <p class="text-white/50">No components selected</p>
                </div>
                <div class="flex gap-4">
                    <button onclick="exportSelections()" class="px-6 py-3 bg-primary/10 border border-primary/30 rounded-lg text-primary hover:bg-primary/20 transition-colors">
                        <span class="material-symbols-outlined align-middle mr-2">download</span>
                        Export Configurations
                    </button>
                    <button onclick="applyToPages()" class="px-6 py-3 bg-accent/10 border border-accent/30 rounded-lg text-accent hover:bg-accent/20 transition-colors">
                        <span class="material-symbols-outlined align-middle mr-2">check_circle</span>
                        Apply to Pages
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- External Scripts -->
    <script src="js/components/QuantumGrid.js"></script>
    <script src="js/components/AudioPlayer.js"></script>
    <script src="js/components/Terminal.js"></script>
    <script src="js/components/CustomCursor.js"></script>
    <script src="js/components/PreLoader.js"></script>
    <script src="js/components/VisualizerToggle.js"></script>

    <script>
        // Component data with visually distinct variations
        const COMPONENTS = [
            {
                id: 'quantum-grid',
                name: 'Quantum Grid Background',
                category: 'background',
                description: 'Interactive animated particle grid system',
                variations: [
                    {
                        name: 'Standard',
                        style: 'quantum-grid-standard',
                        description: 'Balanced particle count and connection distance',
                        config: { particleCount: 50, connectionDistance: 100, speed: 0.5, color: '#00E5FF' }
                    },
                    {
                        name: 'Minimal',
                        style: 'quantum-grid-minimal',
                        description: 'Clean, sparse particle arrangement',
                        config: { particleCount: 20, connectionDistance: 150, speed: 0.3, color: '#ffffff' }
                    },
                    {
                        name: 'Intense',
                        style: 'quantum-grid-intense',
                        description: 'Dense particle network with high activity',
                        config: { particleCount: 100, connectionDistance: 75, speed: 1.0, color: '#00B0FF' }
                    }
                ]
            },
            {
                id: 'terminal',
                name: 'Terminal Interface',
                category: 'ui',
                description: 'Interactive command-line interface',
                variations: [
                    {
                        name: 'Matrix Theme',
                        style: 'terminal-matrix',
                        description: 'Classic green matrix rain terminal',
                        config: { theme: 'matrix', textColor: '#00ff41', backgroundColor: '#0a0a0a', glowEffect: true }
                    },
                    {
                        name: 'Cyberpunk',
                        style: 'terminal-cyberpunk',
                        description: 'Neon purple/pink cyberpunk aesthetic',
                        config: { theme: 'cyberpunk', textColor: '#ff00ff', backgroundColor: '#1a0033', glowEffect: true }
                    },
                    {
                        name: 'Retro',
                        style: 'terminal-retro',
                        description: 'Classic amber retro terminal',
                        config: { theme: 'retro', textColor: '#00ff00', backgroundColor: '#2d2d2d', glowEffect: false }
                    }
                ]
            },
            {
                id: 'audio-player',
                name: 'Audio Player',
                category: 'ui',
                description: 'Ambient sound player with visualization',
                variations: [
                    {
                        name: 'Default',
                        style: 'audio-default',
                        description: 'Standard audio player with visualizer',
                        config: { visualizer: true, controls: 'full', theme: 'default', showPlaylist: false }
                    },
                    {
                        name: 'Minimal',
                        style: 'audio-minimal',
                        description: 'Clean, minimal controls only',
                        config: { visualizer: false, controls: 'minimal', theme: 'dark', showPlaylist: false }
                    },
                    {
                        name: 'Full Featured',
                        style: 'audio-full',
                        description: 'Complete audio player with playlist',
                        config: { visualizer: true, controls: 'full', theme: 'gradient', showPlaylist: true }
                    }
                ]
            },
            {
                id: 'custom-cursor',
                name: 'Custom Cursor',
                category: 'interactive',
                description: 'Enhanced cursor with visual effects',
                variations: [
                    {
                        name: 'Neon Circle',
                        style: 'cursor-neon',
                        description: 'Bright cyan neon circle cursor',
                        config: { type: 'circle', color: '#00E5FF', size: 20, trail: true, glowEffect: true }
                    },
                    {
                        name: 'Minimal Dot',
                        style: 'cursor-minimal',
                        description: 'Simple white dot cursor',
                        config: { type: 'dot', color: '#ffffff', size: 8, trail: false, glowEffect: false }
                    },
                    {
                        name: 'Particle Trail',
                        style: 'cursor-particles',
                        description: 'Blue particle trail effect',
                        config: { type: 'particles', color: '#00B0FF', size: 12, trail: true, particleCount: 5 }
                    }
                ]
            },
            {
                id: 'preloader',
                name: 'PreLoader',
                category: 'utility',
                description: 'Loading screen animations',
                variations: [
                    {
                        name: 'Minimal Spinner',
                        style: 'preloader-spinner',
                        description: 'Simple rotating spinner',
                        config: { style: 'spinner', showText: false, showLogo: false, duration: 2000 }
                    },
                    {
                        name: 'Progress Bar',
                        style: 'preloader-progress',
                        description: 'Progress bar with percentage',
                        config: { style: 'progressbar', showText: true, showLogo: false, duration: 3000 }
                    },
                    {
                        name: 'Pulse Logo',
                        style: 'preloader-pulse',
                        description: 'Pulsing logo with loading text',
                        config: { style: 'pulse', showText: true, showLogo: true, duration: 2500 }
                    }
                ]
            },
            {
                id: 'visualizer-toggle',
                name: 'Visualizer Toggle',
                category: 'interactive',
                description: 'Control panel for visual effects',
                variations: [
                    {
                        name: 'Floating Button',
                        style: 'visualizer-floating',
                        description: 'Floating action button',
                        config: { position: 'floating', style: 'button', alwaysVisible: true }
                    },
                    {
                        name: 'Header Toggle',
                        style: 'visualizer-header',
                        description: 'Toggle in header navigation',
                        config: { position: 'header', style: 'switch', alwaysVisible: true }
                    },
                    {
                        name: 'Sidebar Control',
                        style: 'visualizer-sidebar',
                        description: 'Complete sidebar control panel',
                        config: { position: 'sidebar', style: 'panel', alwaysVisible: false }
                    }
                ]
            }
        ];

        let currentFilter = 'all';
        let selectedVariations = new Map(); // componentId -> variationIndex

        // Initialize gallery
        function initGallery() {
            renderComponents();
            setupEventListeners();
            updateSelectedCount();
        }

        function setupEventListeners() {
            // Category filters
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.category;
                    renderComponents();
                });
            });
        }

        function renderComponents() {
            const container = document.getElementById('components-container');
            const filtered = COMPONENTS.filter(comp =>
                currentFilter === 'all' || comp.category === currentFilter
            );

            container.innerHTML = filtered.map(component => `
                <div class="component-section">
                    <div class="component-header">
                        <div class="flex items-center gap-3 mb-2">
                            <h2 class="text-2xl font-bold text-white">${component.name}</h2>
                            <span class="component-category">${component.category}</span>
                        </div>
                        <p class="text-gray-400">${component.description}</p>
                    </div>
                    <div class="variations-grid">
                        ${component.variations.map((variation, index) => `
                            <div class="variation-card ${isVariationSelected(component.id, index) ? 'selected' : ''}"
                                 id="${component.id}-${index}"
                                 onclick="toggleVariation('${component.id}', ${index})">
                                <div class="variation-header">
                                    <span class="variation-name">${variation.name}</span>
                                    <div class="selection-indicator ${isVariationSelected(component.id, index) ? 'selected' : ''}"></div>
                                </div>
                                <div class="variation-preview ${variation.style}">
                                    ${getVariationPreview(component.id, variation)}
                                </div>
                                <div class="variation-details">
                                    <p class="text-sm text-gray-400 mb-3">${variation.description}</p>
                                    <div class="config-preview">
                                        ${JSON.stringify(variation.config, null, 2)}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Initialize live previews for visible variations
            initializeLivePreviews();
        }

        function getVariationPreview(componentId, variation) {
            const previews = {
                'quantum-grid': {
                    'quantum-grid-standard': '<div class="w-full h-full flex items-center justify-center"><div class="floating-demo"><span class="material-symbols-outlined text-6xl text-primary">grid_4x4</span></div></div>',
                    'quantum-grid-minimal': '<div class="w-full h-full flex items-center justify-center"><div><span class="material-symbols-outlined text-4xl text-white">grid_on</span></div></div>',
                    'quantum-grid-intense': '<div class="w-full h-full flex items-center justify-center"><div class="pulse-demo"><span class="material-symbols-outlined text-6xl text-cyan-400">hub</span></div></div>'
                },
                'terminal': {
                    'terminal-matrix': '<div class="w-full h-full flex items-center justify-center"><div class="text-green-400 font-mono"><span class="material-symbols-outlined text-5xl">terminal</span></div></div>',
                    'terminal-cyberpunk': '<div class="w-full h-full flex items-center justify-center"><div class="text-purple-400"><span class="material-symbols-outlined text-5xl">terminal</span></div></div>',
                    'terminal-retro': '<div class="w-full h-full flex items-center justify-center"><div class="text-green-500"><span class="material-symbols-outlined text-5xl">terminal</span></div></div>'
                },
                'audio-player': {
                    'audio-default': '<div class="w-full h-full flex items-center justify-center"><div><span class="material-symbols-outlined text-5xl text-primary">graphic_eq</span></div></div>',
                    'audio-minimal': '<div class="w-full h-full flex items-center justify-center"><div><span class="material-symbols-outlined text-4xl text-gray-400">volume_up</span></div></div>',
                    'audio-full': '<div class="w-full h-full flex items-center justify-center"><div><span class="material-symbols-outlined text-6xl text-primary">equalizer</span></div></div>'
                },
                'custom-cursor': {
                    'cursor-neon': '<div class="w-full h-full flex items-center justify-center relative"><div class="absolute w-4 h-4 rounded-full bg-cyan-400 shadow-lg shadow-cyan-400/50"></div></div>',
                    'cursor-minimal': '<div class="w-full h-full flex items-center justify-center relative"><div class="absolute w-2 h-2 bg-white rounded-full"></div></div>',
                    'cursor-particles': '<div class="w-full h-full flex items-center justify-center relative"><div class="absolute w-3 h-3 rounded-full bg-blue-400"></div><div class="absolute w-2 h-2 rounded-full bg-blue-300" style="transform: translate(-20px, 5px); opacity: 0.7;"></div><div class="absolute w-2 h-2 rounded-full bg-blue-500" style="transform: translate(15px, -8px); opacity: 0.5;"></div></div>'
                },
                'preloader': {
                    'preloader-spinner': '<div class="w-full h-full flex items-center justify-center"><div class="spin-demo"><span class="material-symbols-outlined text-5xl text-primary">refresh</span></div></div>',
                    'preloader-progress': '<div class="w-full h-full flex items-center justify-center"><div><div class="w-32 h-2 bg-white/20 rounded-full"><div class="w-3/4 h-full bg-primary rounded-full"></div></div><p class="text-primary text-center mt-2">75%</p></div></div>',
                    'preloader-pulse': '<div class="w-full h-full flex items-center justify-center"><div class="pulse-demo"><span class="material-symbols-outlined text-6xl text-primary">radio_button_checked</span></div></div>'
                },
                'visualizer-toggle': {
                    'visualizer-floating': '<div class="w-full h-full flex items-center justify-center"><div class="floating-demo"><span class="material-symbols-outlined text-5xl text-primary">toggle_on</span></div></div>',
                    'visualizer-header': '<div class="w-full h-full flex items-center justify-center"><div class="w-16 h-8 bg-white/20 rounded-full relative"><div class="absolute right-1 top-1 w-6 h-6 bg-primary rounded-full"></div></div></div>',
                    'visualizer-sidebar': '<div class="w-full h-full flex items-center justify-center"><div class="w-20 h-32 bg-white/10 border border-white/20 rounded-lg p-2"><div class="space-y-2"><div class="h-2 bg-primary/50 rounded"></div><div class="h-2 bg-white/30 rounded"></div><div class="h-2 bg-white/30 rounded"></div></div></div></div>'
                }
            };

            return previews[componentId]?.[variation.style] || '<div class="w-full h-full flex items-center justify-center text-gray-400"><span class="material-symbols-outlined text-4xl">extension</span></div>';
        }

        function initializeLivePreviews() {
            // Initialize the first selected variation for each component
            COMPONENTS.forEach(component => {
                const selectedIndex = selectedVariations.get(component.id) || 0;
                const variation = component.variations[selectedIndex];
                if (variation) {
                    // Could initialize actual component instances here if needed
                    // For now, visual previews are sufficient for selection
                }
            });
        }

        function isVariationSelected(componentId, variationIndex) {
            return selectedVariations.get(componentId) === variationIndex;
        }

        function toggleVariation(componentId, variationIndex) {
            if (selectedVariations.get(componentId) === variationIndex) {
                selectedVariations.delete(componentId);
            } else {
                selectedVariations.set(componentId, variationIndex);
            }

            // Update UI
            renderComponents();
            updateSelectedCount();
            updateSelectedSummary();
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = selectedVariations.size;
        }

        function updateSelectedSummary() {
            const summary = document.getElementById('selected-summary');

            if (selectedVariations.size === 0) {
                summary.innerHTML = '<p class="text-white/50">No components selected</p>';
                return;
            }

            const tags = Array.from(selectedVariations.entries()).map(([componentId, variationIndex]) => {
                const component = COMPONENTS.find(c => c.id === componentId);
                const variation = component.variations[variationIndex];
                return `
                    <div class="selected-tag">
                        <span>${component.name}</span>
                        <span class="text-xs">(${variation.name})</span>
                        <button onclick="removeSelection('${componentId}')" class="ml-2 text-primary hover:text-white">×</button>
                    </div>
                `;
            }).join('');

            summary.innerHTML = tags;
        }

        function removeSelection(componentId) {
            selectedVariations.delete(componentId);
            renderComponents();
            updateSelectedCount();
            updateSelectedSummary();
        }

        function selectAll() {
            COMPONENTS.forEach(component => {
                selectedVariations.set(component.id, 0); // Select first variation
            });
            renderComponents();
            updateSelectedCount();
            updateSelectedSummary();
        }

        function clearSelections() {
            selectedVariations.clear();
            renderComponents();
            updateSelectedCount();
            updateSelectedSummary();
        }

        function exportSelections() {
            if (selectedVariations.size === 0) {
                alert('Please select at least one component variation.');
                return;
            }

            const exportData = {
                timestamp: new Date().toISOString(),
                components: Array.from(selectedVariations.entries()).map(([componentId, variationIndex]) => {
                    const component = COMPONENTS.find(c => c.id === componentId);
                    const variation = component.variations[variationIndex];
                    return {
                        id: componentId,
                        name: component.name,
                        category: component.category,
                        selectedVariation: {
                            name: variation.name,
                            description: variation.description,
                            config: variation.config
                        }
                    };
                })
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `component-selections-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function applyToPages() {
            if (selectedVariations.size === 0) {
                alert('Please select component variations first.');
                return;
            }

            const confirmMessage = `Apply ${selectedVariations.size} selected component variations to all pages?\n\nThis will update the styling across home, blog, and projects pages.`;

            if (confirm(confirmMessage)) {
                alert('Component variations applied successfully! The pages will be updated with your selected styles.');
                // Here you would implement the actual application logic
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
