<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEGNTIC — Cognitive OS Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --white:#FFFFFF;
  --bg:#FAFBFC;
  --bg-2:#F2F5F8;
  --panel:#EDF1F5;
  --text:#0A0E14;
  --text-dim:rgba(10,14,20,0.50);
  --text-faint:rgba(10,14,20,0.18);
  --accent:#2563EB;
  --accent-light:#60A5FA;
  --accent-pale:#DBEAFE;
  --border:rgba(10,14,20,0.06);
  --border-mid:rgba(10,14,20,0.10);
  --groove:rgba(10,14,20,0.06);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'Space Mono','Courier New',monospace;
}

html{scroll-behavior:smooth}
body{background:var(--white);color:var(--text);font-family:var(--sans);font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative}

body::before{content:'';position:fixed;inset:0;background-image:url('aegnticdotaitextheader.png');background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0.02;pointer-events:none;z-index:0}
body::-webkit-scrollbar{width:0}

.wireframe-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.wireframe-bg svg{position:absolute;top:0;left:0;width:100%;height:100%}
.wireframe-bg path,.wireframe-bg line,.wireframe-bg circle,.wireframe-bg rect{fill:none;stroke:rgba(10,14,20,0.035);stroke-width:1}
.wireframe-bg .accent-stroke{stroke:rgba(37,99,235,0.06)}

.content{position:relative;z-index:2}

/* LOADER */
.loader{position:fixed;inset:0;background:var(--white);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2rem;transition:opacity 0.6s ease,visibility 0.6s ease}
.loader.hidden{opacity:0;visibility:hidden}
.loader-logo{width:120px;height:auto;animation:loaderPulse 1.6s ease-in-out infinite}
@keyframes loaderPulse{0%,100%{opacity:0.3;transform:scale(0.95)}50%{opacity:1;transform:scale(1)}}
.loader-bar{width:180px;height:1px;background:var(--border);overflow:hidden}
.loader-bar::after{content:'';display:block;width:40%;height:100%;background:var(--accent);animation:loaderSlide 1.2s ease-in-out infinite}
@keyframes loaderSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:var(--text)}
.nav-brand .logo-mark{height:1.1rem;width:auto}
.nav-links{display:flex;align-items:center;gap:2rem}

/* ========== FLAP CORE ========== */
/* The measuring span is hidden but participates in layout for accurate metrics */
.flap-measure{position:absolute;visibility:hidden;white-space:nowrap;z-index:-1}

/* A flap row holds characters inline and wraps naturally */
.flap-row{display:inline;line-height:inherit}

/* A flap word is inline-block so it wraps as a unit */
.flap-word{display:inline-block;vertical-align:top}

/* Each cell is a fixed-size 3D flip container */
.flap-cell{
  display:inline-flex;
  position:relative;
  perspective:500px;
  overflow:hidden;
  vertical-align:top;
}

.flap-3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(0deg);transition:transform 0ms}
.flap-3d.flip{transform:rotateX(-180deg)}

.flap-face{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  line-height:1;
  white-space:nowrap;
}

.flap-back{transform:rotateX(180deg)}

.flap-groove{
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:1px;
  margin-top:-0.5px;
  background:var(--groove);
  z-index:10;
  pointer-events:none;
}

/* Space between words */
.flap-space{display:inline-block;vertical-align:top}

/* ========== TYPOGRAPHY CONTEXTS ========== */
/* Each context class sets the font, size, weight, and letter-spacing */
/* that flap cells inherit. Cell width is set via JS measurement. */

.ctx-display{
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(2.5rem,10vw,8rem);
  line-height:1.0;
  letter-spacing:-0.01em;
}
.ctx-display .flap-cell{background:var(--white);border:1px solid var(--border-mid);box-shadow:0 1px 3px rgba(10,14,20,0.03)}

.ctx-display-italic{
  font-family:var(--serif);
  font-style:italic;
  font-weight:400;
  font-size:clamp(2.5rem,10vw,8rem);
  line-height:1.0;
  letter-spacing:-0.01em;
  color:var(--accent);
}
.ctx-display-italic .flap-cell{background:var(--white);border:1px solid var(--border-mid);box-shadow:0 1px 3px rgba(10,14,20,0.03)}

.ctx-heading{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(1.8rem,4.5vw,3.5rem);
  line-height:1.1;
  letter-spacing:-0.02em;
}
.ctx-heading .flap-cell{background:var(--white);border:1px solid var(--border-mid);box-shadow:0 1px 2px rgba(10,14,20,0.02)}

.ctx-heading-italic{
  font-family:var(--serif);
  font-style:italic;
  font-weight:400;
  font-size:clamp(1.8rem,4.5vw,3.5rem);
  line-height:1.1;
  letter-spacing:-0.02em;
  color:var(--accent);
}
.ctx-heading-italic .flap-cell{background:var(--white);border:1px solid var(--border-mid)}

.ctx-subheading{
  font-family:var(--sans);
  font-weight:600;
  font-size:0.6rem;
  letter-spacing:0.4em;
  text-transform:uppercase;
  color:var(--accent);
  line-height:1.5;
}
.ctx-subheading .flap-cell{background:transparent;border:none;box-shadow:none}
.ctx-subheading .flap-groove{display:none}

.ctx-body{
  font-family:var(--sans);
  font-weight:300;
  font-size:0.95rem;
  line-height:2.0;
  letter-spacing:0.005em;
  color:var(--text-dim);
}
.ctx-body .flap-cell{background:transparent;border:none;box-shadow:none}
.ctx-body .flap-groove{display:none}
.ctx-body .flap-bold{color:var(--text);font-weight:500}

.ctx-label{
  font-family:var(--sans);
  font-weight:500;
  font-size:0.55rem;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:var(--text-dim);
  line-height:1.5;
}
.ctx-label .flap-cell{background:transparent;border:none;box-shadow:none}
.ctx-label .flap-groove{display:none}

.ctx-metric{
  font-family:var(--serif);
  font-weight:300;
  font-size:clamp(2.5rem,5vw,4rem);
  line-height:1;
  letter-spacing:-0.03em;
  color:var(--text);
}
.ctx-metric .flap-cell{background:transparent;border:none;box-shadow:none}
.ctx-metric .flap-groove{background:rgba(10,14,20,0.05)}

.ctx-board{
  font-family:var(--mono);
  font-weight:400;
  font-size:0.72rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--text);
  line-height:1.5;
}
.ctx-board .flap-cell{background:transparent;border:none;box-shadow:none}
.ctx-board .flap-groove{background:rgba(10,14,20,0.05)}

.ctx-board-status{
  font-family:var(--mono);
  font-weight:700;
  font-size:0.72rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--accent);
  line-height:1.5;
}
.ctx-board-status .flap-cell{background:transparent;border:none;box-shadow:none}
.ctx-board-status .flap-groove{background:rgba(10,14,20,0.05)}

.ctx-nav{
  font-family:var(--sans);
  font-weight:500;
  font-size:0.65rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:var(--text-dim);
  line-height:1.5;
}
.ctx-nav .flap-cell{background:transparent;border:none;box-shadow:none}
.ctx-nav .flap-groove{display:none}

/* ========== LAYOUT ========== */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:8rem 5vw 4rem;
  position:relative;
}
.hero-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(500px,60vw);height:auto;opacity:0.025;pointer-events:none;z-index:0}
.hero-inner{position:relative;z-index:1;max-width:1300px;width:100%;margin:0 auto}

.hero-label-row{margin-bottom:2.5rem}
.hero-display-row{margin-bottom:0.3rem}
.hero-sub-row{margin-top:2.5rem;max-width:480px}

.hero-meta{position:absolute;bottom:2rem;left:5vw;right:5vw;display:flex;justify-content:space-between}

.section{padding:5rem 5vw;max-width:1300px;margin:0 auto}
.section-narrow{padding:5rem 5vw;max-width:1000px;margin:0 auto}

.rule{border:none;border-top:1px solid var(--border);max-width:1300px;margin:0 auto}

/* ALIGNMENT HELPERS */
.align-right{text-align:right}
.align-left{text-align:left}
.align-center{text-align:center}

/* Heading row with section label on left, heading on right */
.heading-block{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;margin-bottom:3rem;flex-wrap:wrap}
.heading-block .label-col{flex:0 0 auto}
.heading-block .heading-col{flex:1 1 auto;min-width:300px;text-align:right}

/* DEPARTURE BOARD */
.board{background:var(--white);border:1px solid var(--border-mid);border-radius:4px;box-shadow:0 4px 24px rgba(10,14,20,0.04);overflow:hidden}
.board-header{display:grid;grid-template-columns:50px 1fr 1fr 140px 70px;padding:1rem 1.5rem;background:var(--bg-2);border-bottom:1px solid var(--border-mid);font-family:var(--sans);font-weight:600;font-size:0.55rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--accent)}
.board-row{display:grid;grid-template-columns:50px 1fr 1fr 140px 70px;border-bottom:1px solid var(--border);min-height:56px;transition:background 0.2s}
.board-row:last-child{border-bottom:none}
.board-row:hover{background:var(--bg-2)}
.board-cell{display:flex;align-items:center;padding:0.6rem 1rem;border-right:1px solid var(--border)}
.board-cell:last-child{border-right:none}
.board-cell .idx{font-family:var(--mono);font-size:0.7rem;color:var(--text-faint)}

/* MANIFESTO */
.manifesto-section{padding:6rem 5vw;max-width:1100px;margin:0 auto;position:relative}
.manifesto-bg{position:absolute;top:50%;right:-10%;transform:translateY(-50%);width:500px;height:auto;opacity:0.035;pointer-events:none}
.manifesto-body-row{max-width:540px;margin-top:2rem;position:relative;z-index:1}
.manifesto-heading-row{margin-bottom:0.3rem;position:relative;z-index:1}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-mid);border:1px solid var(--border-mid);border-radius:4px;overflow:hidden}
.metric{background:var(--white);padding:2.5rem 1.5rem;text-align:center;transition:background 0.2s}
.metric:hover{background:var(--bg-2)}
.metric-num-row{margin-bottom:0.8rem;display:flex;justify-content:center}

/* ARCHITECTURE DIAGRAM */
.diagram-section{padding:5rem 5vw;max-width:1300px;margin:0 auto}
.diagram{background:var(--white);border:1px solid var(--border-mid);border-radius:4px;padding:3rem;overflow:hidden}
.diagram-svg{width:100%;height:auto}
.diagram-svg .layer-rect{fill:var(--bg-2);stroke:rgba(10,14,20,0.10);stroke-width:1;rx:2}
.diagram-svg .layer-rect.accent{fill:var(--accent-pale);stroke:rgba(37,99,235,0.20)}
.diagram-svg .layer-text{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;fill:var(--text);text-transform:uppercase;letter-spacing:0.1em}
.diagram-svg .layer-sub{font-family:'Inter',sans-serif;font-size:9px;font-weight:300;fill:var(--text-dim)}
.diagram-svg .connector{fill:none;stroke:rgba(10,14,20,0.08);stroke-width:1}
.diagram-svg .connector-accent{stroke:rgba(37,99,235,0.15)}

/* FEATURES */
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:2rem}
.feature-card{background:var(--white);border:1px solid var(--border-mid);border-radius:4px;padding:2rem;transition:border-color 0.2s}
.feature-card:hover{border-color:var(--accent-light)}
.feature-title-row{margin-bottom:0.8rem}
.feature-body-row{margin-bottom:0}

/* FOOTER */
.footer{padding:5rem 5vw 3rem;border-top:1px solid var(--border-mid);position:relative;background:var(--bg)}
.footer-bg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:400px;height:auto;opacity:0.035;pointer-events:none}
.footer-logo{width:60px;height:auto;margin-bottom:1.5rem}
.footer-display-row{margin-bottom:1.5rem;position:relative;z-index:1}
.footer-meta{display:flex;justify-content:flex-start;gap:2rem;position:relative;z-index:1;flex-wrap:wrap}
.footer-col{flex:1;min-width:200px}
.footer-col-label{margin-bottom:0.5rem}

@media(max-width:900px){
  .metrics-grid{grid-template-columns:repeat(2,1fr)}
  .features-grid{grid-template-columns:1fr}
  .board-header,.board-row{grid-template-columns:40px 1fr 100px}
  .board-cell:nth-child(3),.board-cell:nth-child(5){display:none}
  .board-header span:nth-child(3),.board-header span:nth-child(5){display:none}
  .nav-links{display:none}
  .heading-block{flex-direction:column}
  .heading-block .heading-col{text-align:left}
}
@media(max-width:600px){
  .metrics-grid{grid-template-columns:1fr}
  .diagram{padding:1.5rem}
  .footer-meta{flex-direction:column}
}
</style>
</head>

      <div class="feature-title-row"><div class="flap-row ctx-heading" data-flap="Dialectic" style="font-size:1.3rem"></div></div>

<script>
/* ============================================================
   SPLIT-FLAP ENGINE v2 — auto-measured cells, word wrapping
   ============================================================ */
const FLAP_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,/-';

// Hidden measurement element
const measureEl = document.createElement('span');
measureEl.className = 'flap-measure';
document.documentElement.appendChild(measureEl);

// Measure a character's width given a computed font context
function measureChar(char, ctxEl) {
  const cs = window.getComputedStyle(ctxEl);
  measureEl.style.font = cs.font;
  measureEl.style.letterSpacing = cs.letterSpacing;
  measureEl.style.textTransform = cs.textTransform;
  const displayChar = (char === ' ' || char === '\u00A0') ? '\u00A0' : char;
  measureEl.textContent = displayChar;
  const w = measureEl.getBoundingClientRect().width;
  // Add tiny padding so characters don't touch cell edges
  return Math.ceil(w) + 2;
}

// Measure line-height for the context
function measureLineHeight(ctxEl) {
  const cs = window.getComputedStyle(ctxEl);
  const fs = parseFloat(cs.fontSize);
  // Use the larger of computed line-height or fontSize * 1.1
  const lh = parseFloat(cs.lineHeight);
  return Math.max(lh || fs * 1.2, fs * 1.05);
}

function createFlapCell(char, width, height, ctxEl) {
  const cell = document.createElement('div');
  cell.className = 'flap-cell';
  cell.style.width = width + 'px';
  cell.style.height = height + 'px';
  const displayChar = (char === ' ' || char === '\u00A0') ? '\u00A0' : char;
  cell.innerHTML = `
    <div class="flap-3d">
      <div class="flap-face flap-front">${displayChar}</div>
      <div class="flap-face flap-back">${displayChar}</div>
    </div>
    <div class="flap-groove"></div>
  `;
  cell._isFlipped = false;
  cell._currentChar = char;
  return cell;
}

function flipCellTo(cell, char, duration) {
  const front = cell.querySelector('.flap-front');
  const back = cell.querySelector('.flap-back');
  const flipper = cell.querySelector('.flap-3d');
  const displayChar = (char === ' ' || char === '\u00A0') ? '\u00A0' : char;

  return new Promise(resolve => {
    if (cell._isFlipped) {
      front.textContent = displayChar;
    } else {
      back.textContent = displayChar;
    }

    const eased = duration < 100 ? 'linear' : 'cubic-bezier(0.35, 0.05, 0.2, 1)';
    flipper.style.transition = `transform ${duration}ms ${eased}`;

    if (cell._isFlipped) {
      flipper.classList.remove('flip');
      flipper.style.transform = 'rotateX(0deg)';
    } else {
      flipper.classList.add('flip');
      flipper.style.transform = 'rotateX(-180deg)';
    }

    cell._isFlipped = !cell._isFlipped;
    cell._currentChar = char;
    setTimeout(resolve, duration + 5);
  });
}

async function shuffleCellTo(cell, targetChar, opts) {
  const { cycles = 6, flipMs = 50, gapMs = 12, settleMs = 180 } = opts;
  for (let i = 0; i < cycles; i++) {
    const randChar = FLAP_CHARS[Math.floor(Math.random() * FLAP_CHARS.length)];
    await flipCellTo(cell, randChar, flipMs);
    if (gapMs > 0) await new Promise(r => setTimeout(r, gapMs));
  }
  await flipCellTo(cell, targetChar, settleMs);
}

/* ============================================================
   FlapText — builds and manages flap cells for a text string
   with proper word wrapping and auto-measured character widths
   ============================================================ */
class FlapText {
  constructor(container, text, opts = {}) {
    this.container = container;
    this.text = text;
    this.opts = opts;
    this.cells = [];
    this.revealed = false;
    this.wordGroups = [];
    this.build();
  }

  build() {
    const ctx = this.container; // the .flap-row element with ctx-* class
    const lineHeight = measureLineHeight(ctx);
    const words = this.text.split(' ');

    this.container.innerHTML = '';

    words.forEach((word, wordIdx) => {
      if (wordIdx > 0) {
        // Space between words
        const space = document.createElement('span');
        space.className = 'flap-space';
        space.style.width = Math.ceil(parseFloat(window.getComputedStyle(ctx).fontSize) * 0.28) + 'px';
        space.style.height = lineHeight + 'px';
        this.container.appendChild(space);
      }

      // Word group — wraps as a unit
      const wordEl = document.createElement('span');
      wordEl.className = 'flap-word';
      wordEl.style.height = lineHeight + 'px';

      for (let i = 0; i < word.length; i++) {
        const char = word[i];
        const w = measureChar(char, ctx);
        const cell = createFlapCell('\u00A0', w, lineHeight, ctx);
        wordEl.appendChild(cell);
        this.cells.push({ cell, char, wordIdx, charIdx: i });
      }

      this.container.appendChild(wordEl);
      this.wordGroups.push(wordEl);
    });
  }

  async reveal(staggerMs = 30, cellOpts = {}) {
    if (this.revealed) return;
    this.revealed = true;

    const promises = [];
    for (let i = 0; i < this.cells.length; i++) {
      const { cell, char } = this.cells[i];
      const delay = i * staggerMs;
      const opts = {
        cycles: cellOpts.cycles !== undefined ? cellOpts.cycles : (4 + Math.floor(Math.random() * 4)),
        flipMs: cellOpts.flipMs || 45,
        gapMs: cellOpts.gapMs || 8,
        settleMs: cellOpts.settleMs || 160,
      };
      promises.push(
        new Promise(resolve => {
          setTimeout(() => shuffleCellTo(cell, char, opts).then(resolve), delay);
        })
      );
    }
    await Promise.all(promises);
  }

  reset() {
    this.cells.forEach(({ cell }) => {
      const front = cell.querySelector('.flap-front');
      const back = cell.querySelector('.flap-back');
      const flipper = cell.querySelector('.flap-3d');
      front.textContent = '\u00A0';
      back.textContent = '\u00A0';
      flipper.style.transition = 'none';
      flipper.classList.remove('flip');
      flipper.style.transform = 'rotateX(0deg)';
      cell._isFlipped = false;
      cell._currentChar = '\u00A0';
    });
    this.revealed = false;
  }

  async updateText(newText, opts = {}) {
    // For board cells — simple per-char update
    const newChars = newText.split('');
    while (this.cells.length < newChars.length) {
      const ctx = this.container;
      const lineHeight = measureLineHeight(ctx);
      const w = measureChar('X', ctx);
      const cell = createFlapCell('\u00A0', w, lineHeight, ctx);
      this.container.appendChild(cell);
      this.cells.push({ cell, char: '\u00A0' });
    }
    const promises = [];
    for (let i = 0; i < newChars.length; i++) {
      if (this.cells[i].cell._currentChar !== newChars[i]) {
        const delay = i * (opts.stagger || 25);
        promises.push(
          new Promise(resolve => {
            setTimeout(() => {
              shuffleCellTo(this.cells[i].cell, newChars[i], {
                cycles: opts.cycles || 3,
                flipMs: opts.flipMs || 40,
                gapMs: opts.gapMs || 5,
                settleMs: opts.settleMs || 140,
              }).then(resolve);
            }, delay);
          })
        );
      }
    }
    for (let i = newChars.length; i < this.cells.length; i++) {
      this.cells[i].cell.style.visibility = 'hidden';
    }
    for (let i = 0; i < newChars.length; i++) {
      this.cells[i].cell.style.visibility = 'visible';
    }
    this.text = newText;
    await Promise.all(promises);
  }
}

/* ============================================================
   PARALLAX
   ============================================================ */
let _scrollY = 0, _targetScrollY = 0;
function updateWireParallax() {
  _scrollY += (_targetScrollY - _scrollY) * 0.05;
  const wireBg = document.getElementById('wireBg');
  if (wireBg) wireBg.style.transform = `translateY(${_scrollY * 0.12}px)`;
  requestAnimationFrame(updateWireParallax);
}
window.addEventListener('scroll', () => { _targetScrollY = window.scrollY; });

/* ============================================================
   INIT
   ============================================================ */
// Wait for fonts to load so measurement is accurate
document.fonts.ready.then(() => {
  init();
});

function init() {
  updateWireParallax();

  // Timestamp
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const tsEl = document.getElementById('timestamp');
  if (tsEl) tsEl.setAttribute('data-flap', `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`);

  // Build all flap text from data-flap attributes
  const flapEls = document.querySelectorAll('[data-flap]');
  const flapTexts = [];
  const heroFlaps = [];
  const sectionFlaps = new Map(); // section -> []

  flapEls.forEach(el => {
    const text = el.getAttribute('data-flap');
    const ft = new FlapText(el, text);

    // Categorize
    const hero = el.closest('.hero');
    const section = el.closest('section, footer');

    if (hero) {
      heroFlaps.push(ft);
    } else if (section) {
      if (!sectionFlaps.has(section)) sectionFlaps.set(section, []);
      sectionFlaps.get(section).push(ft);
    }
    flapTexts.push(ft);
  });

  // Reveal nav flaps immediately
  document.querySelectorAll('.nav-links .flap-row').forEach(el => {
    const ft = flapTexts.find(t => t.container === el);
    if (ft) ft.reveal(30, { cycles: 3, flipMs: 35, gapMs: 5, settleMs: 100 });
  });

  // Reveal hero after loader
  setTimeout(() => {
    heroFlaps.forEach((ft, i) => {
      setTimeout(() => {
        ft.reveal(25, { cycles: 5, flipMs: 40, gapMs: 6, settleMs: 150 });
      }, i * 200);
    });
  }, 1000);

  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
  }, 900);

  // Reveal sections on scroll
  sectionFlaps.forEach((flaps, section) => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          if (!section._revealed) {
            section._revealed = true;
            flaps.forEach((ft, i) => {
              setTimeout(() => {
                ft.reveal(20, { cycles: 4, flipMs: 38, gapMs: 5, settleMs: 130 });
              }, i * 150);
            });
          }
        } else {
          if (section._revealed) {
            section._revealed = false;
            flaps.forEach(ft => ft.reset());
          }
        }
      });
    }, { threshold: 0.12 });
    observer.observe(section);
  });

  // Departure board
  const boardData = [
    { idx: '01', module: 'DECISION ENGINE', dimension: 'DIALECTIC', status: 'ACTIVE', track: 'A' },
    { idx: '02', module: 'MEMORY VAULT', dimension: 'EPISODIC', status: 'BOARDING', track: 'B' },
    { idx: '03', module: 'QUALITY GATES', dimension: 'SEVEN-FOLD', status: 'ON TIME', track: 'C' },
    { idx: '04', module: 'VERIFICATION', dimension: 'CONTINUOUS', status: 'ACTIVE', track: 'D' },
    { idx: '05', module: 'AGGRESSION', dimension: 'CALIBRATED', status: 'ON TIME', track: 'E' },
    { idx: '06', module: 'HARNESS LAYER', dimension: 'MULTI-API', status: 'STANDBY', track: 'F' },
  ];

  const boardRows = document.getElementById('boardRows');
  const boardFlaps = [];

  boardData.forEach((row) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'board-row';

    const idxCell = document.createElement('div');
    idxCell.className = 'board-cell';
    idxCell.innerHTML = `<span class="idx">${row.idx}</span>`;
    rowEl.appendChild(idxCell);

    const cells = [
      { cls: 'board-cell', ctx: 'ctx-board', text: row.module },
      { cls: 'board-cell', ctx: 'ctx-board', text: row.dimension },
      { cls: 'board-cell', ctx: 'ctx-board-status', text: row.status },
      { cls: 'board-cell', ctx: 'ctx-board', text: row.track },
    ];

    const rowFlaps = {};
    cells.forEach(c => {
      const cellEl = document.createElement('div');
      cellEl.className = c.cls;
      const flapRow = document.createElement('div');
      flapRow.className = 'flap-row ' + c.ctx;
      cellEl.appendChild(flapRow);
      rowEl.appendChild(cellEl);
      rowFlaps[c.ctx] = new FlapText(flapRow, c.text);
    });

    boardRows.appendChild(rowEl);
    boardFlaps.push({ module: rowFlaps['ctx-board'], dimension: rowFlaps['ctx-board'], status: rowFlaps['ctx-board-status'], track: rowFlaps['ctx-board'], _data: row, _cells: cells, _rowEl: rowEl });
  });

  // Note: board has two ctx-board entries, need to fix mapping
  // Rebuild properly
  boardRows.innerHTML = '';
  const boardFlapsFinal = [];

  boardData.forEach((row) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'board-row';

    const idxCell = document.createElement('div');
    idxCell.className = 'board-cell';
    idxCell.innerHTML = `<span class="idx">${row.idx}</span>`;
    rowEl.appendChild(idxCell);

    function addBoardCell(cls, ctx, text) {
      const cellEl = document.createElement('div');
      cellEl.className = cls;
      const flapRow = document.createElement('div');
      flapRow.className = 'flap-row ' + ctx;
      cellEl.appendChild(flapRow);
      rowEl.appendChild(cellEl);
      return new FlapText(flapRow, text);
    }

    const moduleFlap = addBoardCell('board-cell', 'ctx-board', row.module);
    const dimensionFlap = addBoardCell('board-cell', 'ctx-board', row.dimension);
    const statusFlap = addBoardCell('board-cell', 'ctx-board-status', row.status);
    const trackFlap = addBoardCell('board-cell', 'ctx-board', row.track);

    boardRows.appendChild(rowEl);
    boardFlapsFinal.push({ module: moduleFlap, dimension: dimensionFlap, status: statusFlap, track: trackFlap, _data: row });
  });

  // Reveal board on scroll
  const boardObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        if (!entry.target._revealed) {
          entry.target._revealed = true;
          boardFlapsFinal.forEach((d, i) => {
            setTimeout(() => {
              d.module.reveal(15, { cycles: 3, flipMs: 32, gapMs: 4, settleMs: 110 });
              d.dimension.reveal(15, { cycles: 3, flipMs: 32, gapMs: 4, settleMs: 110 });
              d.status.reveal(20, { cycles: 4, flipMs: 35, gapMs: 5, settleMs: 120 });
              d.track.reveal(50, { cycles: 3, flipMs: 35, settleMs: 130 });
            }, i * 180);
          });
        }
      } else {
        if (entry.target._revealed) {
          entry.target._revealed = false;
          boardFlapsFinal.forEach(d => {
            d.module.reset();
            d.dimension.reset();
            d.status.reset();
            d.track.reset();
          });
        }
      }
    });
  }, { threshold: 0.12 });
  boardObserver.observe(document.querySelector('.board'));

  // Periodic status updates
  const statusOptions = ['ACTIVE', 'BOARDING', 'ON TIME', 'DELAYED', 'STANDBY', 'CHECK-IN'];
  setInterval(() => {
    const randomRow = Math.floor(Math.random() * boardFlapsFinal.length);
    const current = boardFlapsFinal[randomRow]._data.status;
    let newStatus;
    do {
      newStatus = statusOptions[Math.floor(Math.random() * statusOptions.length)];
    } while (newStatus === current);
    boardFlapsFinal[randomRow]._data.status = newStatus;
    boardFlapsFinal[randomRow].status.updateText(newStatus, { cycles: 3, flipMs: 38, settleMs: 130 });
  }, 3500);
}
</script>
