<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegntic.ai - Independent Research Foundation</title>
  <meta name="description"
    content="Zero knowledge, unlimited insight. Advanced research foundation for AI and cryptographic systems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,600&family=JetBrains+Mono:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    /* Custom utility for the metallic text effect */
    .text-metallic {
      background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 50%, #b0b0b0 51%, #f0f0f0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    /* Reflection gradient mask */
    .reflection-mask {
      mask-image: linear-gradient(transparent 30%, black 100%);
      -webkit-mask-image: linear-gradient(transparent 30%, black 100%);
    }

    /* Glow line styling */
    .glow-line {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) scaleX(1.5);
      width: 120%;
      height: 300px;
      border-radius: 50%;
      filter: blur(1px);
      pointer-events: none;
    }

    /* Tech grid pattern */
    .bg-tech-grid {
      background-size: 50px 50px;
      background-image:
        linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
    }

    /* Grainy noise */
    .bg-noise {
      background-image: url('https://grainy-gradients.vercel.app/noise.svg');
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Hide scrollbar for clean look */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.3);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 240, 255, 0.5);
    }
  </style>
</head>

<body class="bg-background-dark text-white antialiased selection:bg-primary selection:text-black overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
