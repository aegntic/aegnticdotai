<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #000; color: #fff; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #0f4c0f; border: 1px solid #4caf50; }
        .error { background: #4c0f0f; border: 1px solid #f44336; }
        button { padding: 10px 20px; margin: 5px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Component Gallery Test</h1>
    <div id="test-results"></div>

    <button onclick="testGalleryAccess()">Test Gallery Access</button>
    <button onclick="openGallery()">Open Gallery</button>

    <script>
        async function testGalleryAccess() {
            const results = document.getElementById('test-results');
            const tests = [
                { name: 'Gallery HTML', url: 'http://localhost:8080/gallery.html' },
                { name: 'Component Gallery JS', url: 'http://localhost:8080/js/gallery/ComponentGallery.js' },
                { name: 'Component Data JS', url: 'http://localhost:8080/js/gallery/ComponentData.js' },
                { name: 'Config Generator JS', url: 'http://localhost:8080/js/gallery/ConfigGenerator.js' },
                { name: 'Gallery CSS', url: 'http://localhost:8080/css/gallery.css' }
            ];

            results.innerHTML = '<h2>Testing Gallery Files...</h2>';

            for (const test of tests) {
                try {
                    const response = await fetch(test.url);
                    const success = response.ok;
                    const status = success ? 'success' : 'error';
                    const message = success ? `✅ ${test.name}: ${response.status}` : `❌ ${test.name}: ${response.status}`;

                    results.innerHTML += `<div class="test-result ${status}">${message}</div>`;
                } catch (error) {
                    results.innerHTML += `<div class="test-result error">❌ ${test.name}: ${error.message}</div>`;
                }
            }
        }

        function openGallery() {
            window.open('http://localhost:8080/gallery.html', '_blank');
        }
    </script>
</body>
</html>
